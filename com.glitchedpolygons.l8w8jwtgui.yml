id: com.glitchedpolygons.l8w8jwtgui
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: l8w8jwtgui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - python3-mbedtls-build-deps.yaml

  - name: l8w8jwtgui
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - '*.a'
    sources:
      - type: git
        url: https://codeberg.org/GlitchedPolygons/l8w8jwtgui.git
        tag: 1.0.5
        commit: f669ffc6bfdb544585b0704d79a616822d9c77b3
        disable-lfs: true
